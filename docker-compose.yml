services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: covid19_etl_api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - SPARK_MASTER=local[*]
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-2g}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-1g}
      - SPARK_DRIVER_MAX_RESULT_SIZE=${SPARK_DRIVER_MAX_RESULT_SIZE:-1g}
      - SPARK_SQL_SHUFFLE_PARTITIONS=${SPARK_SQL_SHUFFLE_PARTITIONS:-8}
      - SPARK_LOG_LEVEL=${SPARK_LOG_LEVEL:-INFO}
      - SPARK_JDBC_BATCH_SIZE=${SPARK_JDBC_BATCH_SIZE:-10000}
      - SPARK_JDBC_CONNECT_TIMEOUT_MS=${SPARK_JDBC_CONNECT_TIMEOUT_MS:-60000}
      - SPARK_JDBC_SOCKET_TIMEOUT_MS=${SPARK_JDBC_SOCKET_TIMEOUT_MS:-60000}
    deploy:
      resources:
        limits:
          memory: 3500M
          cpus: "2.5"
        reservations:
          memory: 1500M

  mysql_local:
    image: mysql:8.4
    container_name: covid19_mysql_local
    restart: unless-stopped
    profiles:
      - with-local-db
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${LOCAL_DB_NAME:-covid19}
    ports:
      - "${LOCAL_DB_PORT:-3306}:3306"
    volumes:
      - local_mysql_data:/var/lib/mysql

volumes:
  local_mysql_data:

